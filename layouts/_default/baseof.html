<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Date.Format "2 January 2006" }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <a class="skip" href="#edition">Skip to edition</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="{{ "/" | relURL }}">
        <span class="wordmark-kicker">AI NEWS</span>
        <span class="wordmark-rule" aria-hidden="true"></span>
        <span class="wordmark-sub">Daily Digest</span>
      </a>
    </div>
  </header>
  <div class="frame">
    {{ partial "nav.html" . }}
    <main id="edition" class="edition">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  <footer class="colophon">
    <div class="colophon-inner">
      <p>Weekday mornings, America/Bogotá. An archive of Cali’s AI newsletter digest.</p>
    </div>
  </footer>
  <script src="{{ "js/player.js" | relURL }}" defer></script>
</body>
</html>
